name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # Tests run against the "test" Spring profile (H2, see
        # src/test/resources/application-test.properties) — no Postgres
        # container or secrets needed in CI.
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Build backend Docker image
        run: docker build -t blncr-backend:ci .

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A placeholder API URL is enough — this only verifies the production
        # build compiles, it doesn't call the API.
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.invalid