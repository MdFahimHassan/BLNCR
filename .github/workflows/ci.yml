name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the repo. Without this, GITHUB_TOKEN gets broader default rights.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        # git doesn't always preserve the executable bit on mvnw depending on how the
        # repo was created/transferred — set it explicitly instead of trusting file mode.
        run: chmod +x mvnw

      - name: Run tests
        # Tests run against the "test" Spring profile (H2, see
        # src/test/resources/application-test.properties) — no Postgres
        # container or secrets needed in CI.
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Build backend Docker image
        run: docker build -t blncr-backend:ci .

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies for known vulnerabilities
        # Fails the build on any HIGH/CRITICAL advisory in packages that ship to users.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error

      - name: Build
        # A placeholder API URL is enough — this only verifies the production
        # build compiles, it doesn't call the API.
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.invalid