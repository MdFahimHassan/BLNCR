<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="'Geist Sans', ui-sans-serif, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d7ff3e"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c616c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#0a0b0d"/>

  <!-- Title -->
  <text x="40" y="46" fill="#f2f3f5" font-size="22" font-weight="700">BLNCR — System Architecture</text>
  <text x="40" y="70" fill="#5c616c" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">client (React) → api (Spring Boot) → data (PostgreSQL), shipped via Docker + CI/CD</text>

  <!-- ============ SOURCE / CI ROW ============ -->
  <rect x="430" y="100" width="340" height="64" rx="10" fill="#131519" stroke="#33383f"/>
  <text x="600" y="126" fill="#f2f3f5" font-size="15" font-weight="600" text-anchor="middle">GitHub — MdFahimHassan/BLNCR</text>
  <text x="600" y="148" fill="#9aa0ac" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.github/workflows/ci.yml · test + build on every push</text>

  <!-- CI branch lines to deploy targets -->
  <path d="M520,164 C 400,210 260,230 205,258" fill="none" stroke="#5c616c" stroke-width="1.5" marker-end="url(#arrowSoft)"/>
  <path d="M680,164 C 800,210 935,230 990,258" fill="none" stroke="#5c616c" stroke-width="1.5" marker-end="url(#arrowSoft)"/>
  <text x="330" y="200" fill="#5c616c" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">frontend job</text>
  <text x="845" y="200" fill="#5c616c" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">backend job</text>

  <!-- ============ DEPLOY TARGET LABELS ============ -->
  <text x="205" y="245" fill="#d7ff3e" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">▲ VERCEL</text>
  <text x="990" y="245" fill="#d7ff3e" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">▲ RENDER (Docker)</text>

  <!-- ============ FRONTEND BOX ============ -->
  <rect x="60" y="264" width="290" height="330" rx="12" fill="#0e1013" stroke="#24282f" stroke-width="1.5"/>
  <text x="205" y="296" fill="#f2f3f5" font-size="15" font-weight="700" text-anchor="middle">React Frontend</text>
  <text x="205" y="316" fill="#9aa0ac" font-size="11.5" text-anchor="middle">Vite · React 19 · React Router 7</text>
  <text x="205" y="332" fill="#9aa0ac" font-size="11.5" text-anchor="middle">Tailwind CSS v4 · Axios</text>

  <rect x="82" y="350" width="246" height="90" rx="8" fill="#131519" stroke="#1a1d23"/>
  <text x="94" y="370" fill="#f2f3f5" font-size="11.5" font-weight="600">Pages</text>
  <text x="94" y="388" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Login · Register</text>
  <text x="94" y="404" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Dashboard · GroupPage</text>
  <text x="94" y="420" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">  (Expenses/Balances/</text>
  <text x="94" y="434" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">   Activity/Members)</text>

  <rect x="82" y="452" width="246" height="70" rx="8" fill="#131519" stroke="#1a1d23"/>
  <text x="94" y="472" fill="#f2f3f5" font-size="11.5" font-weight="600">State &amp; API layer</text>
  <text x="94" y="490" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">AuthContext (JWT)</text>
  <text x="94" y="506" fill="#9aa0ac" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">api/client.js · endpoints.js</text>

  <rect x="82" y="536" width="246" height="40" rx="8" fill="#0f2420" stroke="#193c33"/>
  <text x="205" y="561" fill="#34d399" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.ledger-figure — tabular-nums mono</text>

  <!-- ============ BACKEND BOX ============ -->
  <rect x="440" y="264" width="320" height="330" rx="12" fill="#0e1013" stroke="#24282f" stroke-width="1.5"/>
  <text x="600" y="296" fill="#f2f3f5" font-size="15" font-weight="700" text-anchor="middle">Spring Boot API</text>
  <text x="600" y="316" fill="#9aa0ac" font-size="11.5" text-anchor="middle">Java 21 · Spring Security · JPA/Hibernate</text>

  <rect x="462" y="332" width="276" height="36" rx="7" fill="#131519" stroke="#1a1d23"/>
  <text x="600" y="355" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JwtAuthenticationFilter</text>

  <rect x="462" y="378" width="276" height="36" rx="7" fill="#131519" stroke="#1a1d23"/>
  <text x="600" y="401" fill="#f2f3f5" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">controller</text>

  <path d="M600,414 L600,424" stroke="#33383f" stroke-width="1.5" marker-end="url(#arrowSoft)"/>

  <rect x="462" y="424" width="276" height="46" rx="7" fill="#131519" stroke="#33383f" stroke-width="1.5"/>
  <text x="600" y="444" fill="#f2f3f5" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">service</text>
  <text x="600" y="460" fill="#d7ff3e" font-size="10" text-anchor="middle">SplitCalculator · BalanceService (debt-simplification)</text>

  <path d="M600,470 L600,480" stroke="#33383f" stroke-width="1.5" marker-end="url(#arrowSoft)"/>

  <rect x="462" y="480" width="276" height="36" rx="7" fill="#131519" stroke="#1a1d23"/>
  <text x="600" y="503" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">repository (Spring Data JPA)</text>

  <rect x="462" y="530" width="276" height="46" rx="7" fill="#131519" stroke="#1a1d23"/>
  <text x="600" y="550" fill="#f2f3f5" font-size="11" font-weight="600" text-anchor="middle">All money as BigDecimal</text>
  <text x="600" y="566" fill="#9aa0ac" font-size="10.5" text-anchor="middle">split math done in integer cents</text>

  <!-- ============ DATABASE BOX ============ -->
  <rect x="880" y="264" width="260" height="330" rx="12" fill="#0e1013" stroke="#24282f" stroke-width="1.5"/>
  <text x="1010" y="296" fill="#f2f3f5" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="1010" y="316" fill="#9aa0ac" font-size="11.5" text-anchor="middle">Neon managed Postgres</text>

  <rect x="902" y="334" width="216" height="150" rx="8" fill="#131519" stroke="#1a1d23"/>
  <text x="914" y="354" fill="#f2f3f5" font-size="11.5" font-weight="600">Tables</text>
  <text x="914" y="372" fill="#9aa0ac" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">users · groups</text>
  <text x="914" y="388" fill="#9aa0ac" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">group_members</text>
  <text x="914" y="404" fill="#9aa0ac" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">expenses · expense_splits</text>
  <text x="914" y="420" fill="#9aa0ac" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">settlements</text>
  <text x="914" y="444" fill="#5c616c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">FK indexes + unique</text>
  <text x="914" y="458" fill="#5c616c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">(group_id, user_id)</text>

  <rect x="902" y="500" width="216" height="60" rx="8" fill="#131519" stroke="#33383f" stroke-width="1.5"/>
  <text x="1010" y="522" fill="#f2f3f5" font-size="11.5" font-weight="600" text-anchor="middle">Flyway</text>
  <text x="1010" y="540" fill="#9aa0ac" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">V1__init_schema.sql</text>
  <text x="1010" y="553" fill="#9aa0ac" font-size="10" text-anchor="middle">ddl-auto=validate</text>

  <!-- ============ CONNECTORS BETWEEN MAIN BOXES ============ -->
  <path d="M350,400 L440,400" fill="none" stroke="#d7ff3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="380" fill="#d7ff3e" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">REST/JSON</text>

  <path d="M440,440 L350,440" fill="none" stroke="#5c616c" stroke-width="1.5" marker-end="url(#arrowSoft)"/>
  <text x="395" y="460" fill="#9aa0ac" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Bearer JWT</text>

  <path d="M760,400 L880,400" fill="none" stroke="#d7ff3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="380" fill="#d7ff3e" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">JPA/</text>
  <text x="820" y="392" fill="#d7ff3e" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Hibernate</text>

  <!-- ============ FOOTER STRIP ============ -->
  <rect x="40" y="650" width="1120" height="70" rx="10" fill="#131519" stroke="#1a1d23"/>
  <text x="60" y="676" fill="#f2f3f5" font-size="12" font-weight="600">Deployed:</text>
  <text x="150" y="676" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace">blncr-xi.vercel.app  (frontend)</text>
  <text x="150" y="694" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace">blncr.onrender.com  (API)</text>
  <text x="620" y="676" fill="#f2f3f5" font-size="12" font-weight="600">Also true locally:</text>
  <text x="750" y="676" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace">docker compose up --build</text>
  <text x="750" y="694" fill="#9aa0ac" font-size="11.5" font-family="'Geist Mono', ui-monospace, monospace">→ backend + Postgres, no local installs</text>
</svg>
