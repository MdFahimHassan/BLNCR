services:
  db:
    image: postgres:18
    container_name: blncr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-blncr}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      # No default: compose refuses to start until DB_PASSWORD is set in .env.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (see .env.example)}
    ports:
      # Bound to localhost only, for a local DB client. The backend uses the internal Docker network,
      # so remove this port mapping entirely in production.
      - "127.0.0.1:5433:5432"
    volumes:
      - blncr-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-blncr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blncr-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-blncr}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (openssl rand -base64 64)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      EMAIL_MX_CHECK: ${EMAIL_MX_CHECK:-true}
      SERVER_PORT: 9090
    ports:
      - "9090:9090"
    # Container hardening: the app needs no extra Linux capabilities and must never gain new privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  blncr-db-data: