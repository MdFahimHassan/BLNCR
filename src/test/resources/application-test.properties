spring.application.name=blncr-test

# In-memory H2 in PostgreSQL-compatibility mode, so JPA/Hibernate behavior stays close
# to the real production database without needing a running Postgres container in CI.
spring.datasource.url=jdbc:h2:mem:blncr-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway is for the real Postgres schema (Phase 6) — tests still let Hibernate
# create/drop the H2 schema directly from the entities, so this profile is
# unaffected by migration changes.
spring.flyway.enabled=false

# Also provided directly here so tests never depend on CORS_ALLOWED_ORIGINS being set.
cors.allowed-origins=http://localhost:5173,http://localhost:3000

server.port=0

# Test-only JWT secret (256-bit, base64) — never used outside the test profile.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWJsbmNyLWp1bml0LXRlc3RzLTEyMzQ1Ng==
jwt.expiration-ms=3600000