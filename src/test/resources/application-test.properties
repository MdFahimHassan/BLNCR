spring.application.name=blncr-test

# In-memory H2 in PostgreSQL-compatibility mode, so JPA/Hibernate behavior stays close
# to the real production database without needing a running Postgres container in CI.
spring.datasource.url=jdbc:h2:mem:blncr-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway targets the real Postgres schema; tests let Hibernate create/drop the H2 schema from the entities.
spring.flyway.enabled=false

# Also provided directly here so tests never depend on CORS_ALLOWED_ORIGINS being set.
cors.allowed-origins=http://localhost:5173,http://localhost:3000

server.port=0

# Test-only JWT secret (256-bit, base64) — never used outside the test profile.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWJsbmNyLWp1bml0LXRlc3RzLTEyMzQ1Ng==
jwt.expiration-ms=86400000

# Tests register many users from the same (mock) IP within a minute and must not be throttled,
# and must never depend on live DNS. (Production values live in application.properties.)
security.rate-limit.login-per-minute=100000
security.rate-limit.register-per-minute=100000
app.email.mx-check=false
