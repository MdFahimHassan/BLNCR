spring.application.name=blncr

# Database
# Every value has a sane local-dev default (matches the docker-compose service),
# but all of them are overridable via environment variables in real deployments —
# nothing sensitive is hardcoded anymore (Phase 6).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blncr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:blncr123}

# JPA / Hibernate
# ddl-auto is now "validate" instead of "update": Hibernate checks the schema matches
# the entities but never mutates it. Flyway (below) is the only thing allowed to
# change schema, so migrations are explicit, versioned, and safe to run in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:9090}

# JWT
# No secret is checked in anymore. JWT_SECRET must be provided via environment
# variable in every environment (see .env.example / docker-compose.yml); the app
# fails fast on boot if it's missing rather than silently running with a weak default.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
# Comma-separated list of allowed frontend origins, read by SecurityConfig.
# Defaults to the local Vite dev server; set to the deployed Vercel URL in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}