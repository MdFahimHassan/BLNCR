spring.application.name=blncr

# Emit one JSON record per log event; MDC contains the requestId from RequestIdFilter.
logging.structured.format.console=${LOG_FORMAT:logstash}

# Error reporting is opt-in; without a DSN, Sentry remains disabled.
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false
sentry.environment=${SENTRY_ENVIRONMENT:local}

# Database
# Host/port/name/username have sane local-dev defaults (matching the docker-compose service),
# but the PASSWORD deliberately has NO default: the app refuses to start unless DB_PASSWORD is
# set, so a forgotten env var can never silently fall back to a guessable credential.
# DB_SSL_MODE: "prefer" tries TLS and falls back (fine for local Docker); set it to "require"
# (or "verify-full") for any hosted database so credentials and data are encrypted in transit.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blncr}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Hibernate only validates the schema against the entities; Flyway (below) is the only thing that changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Timestamps are java.time.Instant (an absolute moment in UTC) stored as TIMESTAMPTZ. Pinning the
# JDBC time zone to UTC makes the stored values independent of whatever zone the host JVM runs in.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:9090}

# Keep the management surface to basic health probes; readiness includes the datasource check.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Behind a reverse proxy / PaaS (Railway, Render, ...) TLS ends at the proxy. "native" makes Tomcat
# honour X-Forwarded-For / X-Forwarded-Proto ONLY when they come from a trusted internal proxy, so
# (a) request.getRemoteAddr() is the real client IP (needed for per-IP rate limiting) and
# (b) requests count as HTTPS, which is what makes the HSTS header get sent.
server.forward-headers-strategy=native

# Never put exception messages, stack traces, or binding details in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Avatar uploads are the only multipart endpoint; requests stay tightly bounded.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=700KB

# JWT
# No secret is checked in: JWT_SECRET must be set in every environment (see .env.example / docker-compose.yml),
# and the app fails fast on boot if it is missing or too short.
# Default lifetime is 1 hour so a stolen token is only briefly useful; logout also revokes the token server-side.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
# Comma-separated list of allowed frontend origins, read by SecurityConfig.
# Defaults to the local Vite dev server; set to the deployed Vercel URL in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Abuse protection (see ApiProtectionFilter / SecurityConfig)
security.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:20}
security.rate-limit.register-per-minute=${RATE_LIMIT_REGISTER_PER_MINUTE:10}
security.max-body-bytes=${MAX_BODY_BYTES:65536}

# Registration email check: after syntax + reserved-domain checks, confirm the domain exists in
# DNS and can receive mail (MX, or A/AAAA fallback). Set EMAIL_MX_CHECK=false to turn the DNS
# lookup off (syntax and reserved-domain checks always stay on).
app.email.mx-check=${EMAIL_MX_CHECK:true}